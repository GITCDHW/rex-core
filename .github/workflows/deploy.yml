name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main # Triggers deployment when pushing to the main branch
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository onto the runner
      - name: Checkout Repo
        uses: actions/checkout@v4

      # Step 2: Set up the Supabase CLI engine
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Step 3: Deploy all functions found inside the supabase/functions/ directory
      - name: Deploy Functions
        run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

        