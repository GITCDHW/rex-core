<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For My Sister 💌</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <link rel="preload" as="image" href="table.png" />
  <link rel="preload" as="image" href="envelope.png" />
  <link rel="preload" as="image" href="letter.png" />

  <style>
    /* =====================================================
       RESET & ROOT SETUP
    ===================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background-color: #000;
      font-family: "Cormorant Garamond", Georgia, serif;
      color: #f7ede2;
      position: fixed;
      inset: 0;
    }

    /* Master container handling orientation normalization */
    #app-container {
      position: absolute;
      inset: 0;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
    }

    /* =====================================================
       FORCED ROTATION (PORTRAIT OVERRIDE)
    ===================================================== */
    @media (orientation: portrait) {
      #app-container {
        width: 100dvh !important;
        height: 100dvw !important;
        top: 50% !important;
        left: 50% !important;
        transform: translate(-50%, -50%) rotate(90deg) !important;
        transform-origin: center center !important;
      }
    }

    /* =====================================================
       ROTATE PHONE LOADER (BLACK BG OVERLAY)
    ===================================================== */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      width: 100dvw;
      height: 100vh;
      height: 100dvh;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      opacity: 1;
      visibility: visible;
      transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.2s ease;
    }

    #loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-icon {
      font-size: 36px;
      line-height: 1;
      filter: drop-shadow(0 0 16px rgba(255, 255, 255, 0.3));
      animation: rotatePhoneAnim 2.2s infinite ease-in-out;
    }

    .loader-text {
      font-family: "Montserrat", sans-serif;
      font-size: clamp(11px, 2vmin, 14px);
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #f7ede2;
      opacity: 0.85;
      text-shadow: 0 0 12px rgba(247, 237, 226, 0.3);
      animation: pulseText 2.2s infinite ease-in-out;
    }

    /* Elegant Thin Progress Bar */
    .loader-bar-wrapper {
      width: 140px;
      height: 1px;
      background: rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      margin-top: 4px;
    }

    .loader-bar-progress {
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #f7ede2, transparent);
      animation: sweepBar 2.2s cubic-bezier(0.65, 0, 0.35, 1) infinite;
    }

    @keyframes rotatePhoneAnim {
      0%, 15% { transform: rotate(0deg); }
      50%, 65% { transform: rotate(-90deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    @keyframes sweepBar {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* =====================================================
       MAIN TABLE SCENE
    ===================================================== */
    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url("table.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Warm Ambient Lighting */
    #scene::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(
        circle at 50% 50%,
        rgba(255, 220, 160, 0.18) 0%,
        rgba(255, 180, 80, 0.08) 45%,
        transparent 75%
      );
      mix-blend-mode: screen;
      z-index: 1;
    }

    /* Subtle Vignette Overlay */
    #scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.05) 20%, rgba(5, 4, 3, 0.6) 100%);
      z-index: 2;
    }

    /* Top Header Section */
    .header-content {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      text-align: center;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .date-stamp {
      font-size: clamp(15px, 2.2vmin, 20px);
      letter-spacing: 0.35em;
      font-weight: 300;
      color: rgba(244, 234, 224, 0.7);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .title-banner {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-size: clamp(20px, 3.2vmin, 28px);
      letter-spacing: 0.12em;
      font-weight: 400;
      color: #fcebd9;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.75), 0 0 18px rgba(252, 235, 217, 0.2);
    }

    /* =====================================================
       ENVELOPE BUTTON & ZOOM INTERACTION
    ===================================================== */
    #envelopeButton {
      position: absolute;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(1);
      border: none;
      outline: none;
      background: transparent;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: envelopeFloat 5s ease-in-out infinite alternate;
      transition: transform 1.1s cubic-bezier(0.2, 0.9, 0.2, 1),
                  opacity 0.9s cubic-bezier(0.2, 0.9, 0.2, 1),
                  filter 1.1s ease;
    }

    #envelopeButton img {
      display: block;
      width: clamp(220px, 32vmin, 360px);
      height: auto;
      pointer-events: none;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.5));
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    #envelopeButton:hover img {
      transform: scale(1.04);
      filter: drop-shadow(0 28px 40px rgba(0, 0, 0, 0.65));
    }

    #envelopeButton:active img {
      transform: scale(0.97);
    }

    /* Envelope Floating Animation */
    @keyframes envelopeFloat {
      0% {
        transform: translate(-50%, -50%) rotate(0deg);
      }
      100% {
        transform: translate(-50%, -52.5%) rotate(0.6deg);
      }
    }

    /* Enlarging / Zoom-in State on Click */
    #envelopeButton.enlarging {
      animation: none;
      transform: translate(-50%, -50%) scale(2.4) !important;
      opacity: 0;
      pointer-events: none;
      filter: blur(4px);
    }

    /* Tap hint underneath */
    .tap-hint {
      position: absolute;
      top: calc(50% + clamp(90px, 15vmin, 150px));
      left: 50%;
      transform: translateX(-50%);
      font-family: "Montserrat", sans-serif;
      font-size: clamp(10px, 1.6vmin, 12px);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(244, 234, 224, 0.5);
      z-index: 5;
      pointer-events: none;
      animation: pulseHint 3s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }

    @keyframes pulseHint {
      0%, 100% { opacity: 0.35; transform: translate(-50%, 0); }
      50% { opacity: 0.8; transform: translate(-50%, -3px); }
    }

    /* =====================================================
       LETTER MODAL SCENE
    ===================================================== */
    #letterScene {
      position: absolute;
      inset: 0;
      z-index: 2000;
      width: 100%;
      height: 100%;
      background: rgba(10, 8, 7, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      cursor: pointer;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.9s ease;
    }

    #letterScene.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #letter {
      display: block;
      max-width: 88%;
      max-height: 82%;
      width: auto;
      height: auto;
      object-fit: contain;
      transform: scale(0.65) translateY(40px) rotate(-1.5deg);
      filter: drop-shadow(0 25px 50px rgba(0, 0, 0, 0.85));
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1), filter 1s ease;
    }

    #letterScene.visible #letter {
      transform: scale(1) translateY(0) rotate(0deg);
    }

    .close-hint {
      position: absolute;
      bottom: 20px;
      font-family: "Montserrat", sans-serif;
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(244, 234, 224, 0.45);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease 0.4s;
    }

    #letterScene.visible .close-hint {
      opacity: 1;
    }
  </style>
</head>

<body>

  <section id="loader">
    <div class="loader-icon">📱</div>
    <div class="loader-text">Rotate your phone</div>
    <div class="loader-bar-wrapper">
      <div class="loader-bar-progress"></div>
    </div>
  </section>

  <div id="app-container">

    <main id="scene">
      <div class="header-content">
        <div class="date-stamp">28 · 08 · 2026</div>
        <div class="title-banner">A Letter For You</div>
      </div>

      <button id="envelopeButton" aria-label="Open the envelope">
        <img src="envelope.png" alt="A sealed envelope" />
      </button>

      <div class="tap-hint" id="tapHint">Tap to open</div>
    </main>

    <section id="letterScene" role="dialog" aria-modal="true" aria-label="Letter View">
      <img id="letter" src="letter.png" alt="A handwritten letter" />
      <div class="close-hint">Tap anywhere to close</div>
    </section>

  </div>

  <script>
    const loader = document.getElementById("loader");
    const envelopeButton = document.getElementById("envelopeButton");
    const letterScene = document.getElementById("letterScene");
    const tapHint = document.getElementById("tapHint");

    const LOADER_DURATION = 2400; // Duration in ms before revealing the table
    let letterOpened = false;

    // Fade out loader on page load
    window.addEventListener("load", () => {
      setTimeout(() => {
        loader.classList.add("hidden");
      }, LOADER_DURATION);
    });

    // Open Letter: Enlarge envelope -> fade in letter
    function openEnvelope() {
      if (letterOpened) return;
      letterOpened = true;

      // Hide the hint
      tapHint.style.opacity = "0";

      // Trigger envelope enlargement animation
      envelopeButton.classList.add("enlarging");

      // Reveal the letter smoothly as the envelope zooms in
      setTimeout(() => {
        letterScene.classList.add("visible");
      }, 450);
    }

    // Close Letter: Return to default envelope state on table
    function closeLetter() {
      if (!letterOpened) return;
      letterScene.classList.remove("visible");

      setTimeout(() => {
        letterOpened = false;
        envelopeButton.classList.remove("enlarging");
        tapHint.style.opacity = "";
      }, 500);
    }

    // Event listeners
    envelopeButton.addEventListener("click", openEnvelope);
    letterScene.addEventListener("click", closeLetter);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && letterOpened) {
        closeLetter();
      }
    });
  </script>
</body>
</html>
